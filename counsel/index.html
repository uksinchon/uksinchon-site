<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>상담신청 | 영국유학센터 신촌지사</title>
  <meta name="description" content="영국유학센터 신촌지사 상담신청서. 어학연수·조기유학·파운데이션·학사·석사·박사·비자 상담을 신청하세요." />
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root{--navy:#1A2E5A;--coral:#E8432B;--ink:#222;--sub:#666;--line:#d9dde3;--soft:#f5f6f8}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;word-break:keep-all}
    .hide{display:none!important}
    .topbar{border-bottom:1px solid var(--line)}
    .topbar-inner{max-width:1000px;margin:0 auto;padding:12px 20px;display:flex;align-items:center}
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--navy)}
    .brand img{height:40px;width:auto;display:block}
    .brand span{font-weight:800;letter-spacing:-.3px}
    .wrap{max-width:1000px;margin:0 auto;padding:40px 20px 56px}
    h1{text-align:center;color:var(--coral);font-size:30px;margin:0 0 36px;letter-spacing:-.5px}
    .sec{margin-bottom:34px}
    .sec h2{font-size:24px;margin:0;padding-bottom:8px;letter-spacing:-.5px;border-bottom:1px solid #c9ced6;position:relative}
    .sec h2::after{content:"";position:absolute;left:0;bottom:-2px;width:160px;height:3px;background:var(--coral)}
    .row{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;padding:8px 0}
    .row>.lbl{text-align:right;font-weight:700;color:#444}
    .req::after{content:" *";color:var(--coral)}
    input[type=text],input[type=email],input[type=tel],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:3px;font:inherit;color:var(--ink);background:#fff}
    input:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 2px rgba(26,46,90,.12)}
    textarea{min-height:110px;resize:vertical}
    .opts{display:flex;flex-wrap:wrap;gap:6px 18px}
    .opts label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:#333}
    .opts input{width:15px;height:15px;margin:0;accent-color:var(--navy)}
    .bad{color:var(--coral)!important}
    .agree{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
    .agree label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
    .agree input{width:15px;height:15px;margin:0;accent-color:var(--navy)}
    .agree a{font-size:14px;color:var(--navy);border:1px solid var(--navy);padding:1px 7px;text-decoration:none}
    .btns{display:flex;justify-content:center;gap:6px}
    .btn{border:0;padding:12px 26px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;color:#fff}
    .btn-primary{background:var(--coral)}.btn-primary:disabled{opacity:.6;cursor:wait}
    .btn-dark{background:#3a3f47}
    .msg{padding:14px 16px;border-radius:4px;margin:0 0 24px;text-align:center}
    .success{background:#e8f5ee;color:#1d6b45}
    .error{background:#fdecea;color:#a12a1a}
    .foot{border-top:1px solid var(--line);background:var(--soft)}
    .foot .box{max-width:1000px;margin:0 auto;padding:20px;font-size:13px;color:var(--sub);line-height:1.8}
    .foot strong{color:#333}
    .foot a{color:var(--navy)}
    @media(max-width:700px){
      .wrap{padding:28px 16px 44px}
      h1{font-size:26px;margin-bottom:26px}
      .sec h2{font-size:21px}
      .row{grid-template-columns:1fr;gap:6px;padding:7px 0}
      .row>.lbl{text-align:left}
      .btn{flex:1;padding:13px 10px}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="https://uksinchon.com/">
        <img src="logo.png" alt="영국유학센터 로고" />
        <span>영국유학센터 신촌지사</span>
      </a>
    </div>
  </div>

  <main class="wrap">
    <h1>상담신청</h1>

    <div id="msg-success" class="msg success hide">접수되었습니다! 곧 담당자가 <strong>j.lee@ukcentre.co.kr</strong>에서 연락드립니다.</div>
    <div id="msg-error" class="msg error hide">전송에 실패했습니다. 잠시 후 다시 시도해 주세요.</div>

    <form id="counsel-form" action="https://formspree.io/f/mjkpjdka" method="POST" novalidate>
      <input type="text" name="_gotcha" class="hide" tabindex="-1" autocomplete="off" aria-hidden="true" />

      <section class="sec">
        <h2>개인정보</h2>
        <div class="row"><label class="lbl req" for="email">이메일</label><input id="email" name="이메일" type="email" autocomplete="email" required /></div>
        <div class="row"><label class="lbl req" for="name">성명</label><input id="name" name="성명" type="text" autocomplete="name" required /></div>
        <div class="row"><label class="lbl req" for="phone">휴대폰</label><input id="phone" name="휴대폰" type="tel" autocomplete="tel" placeholder="010-1234-5678 혹은 +44 123-4567-8900" required /></div>
        <div class="row" role="radiogroup" aria-labelledby="l-gender"><span class="lbl req" id="l-gender">성별</span>
          <div class="opts" data-group="성별"><label><input type="radio" name="성별" value="남자" />남자</label><label><input type="radio" name="성별" value="여자" />여자</label></div></div>
        <div class="row"><label class="lbl" for="kakao">카카오톡 아이디</label><input id="kakao" name="카카오톡 아이디" type="text" /></div>
      </section>

      <section class="sec">
        <h2>상담정보</h2>
        <div class="row" role="group" aria-labelledby="l-interest"><span class="lbl req" id="l-interest">관심분야</span>
          <div class="opts" data-group="관심분야">
            <label><input type="checkbox" name="관심분야" value="어학연수" />어학연수</label>
            <label><input type="checkbox" name="관심분야" value="조기유학" />조기유학</label>
            <label><input type="checkbox" name="관심분야" value="전문교육과정" />전문교육과정</label>
            <label><input type="checkbox" name="관심분야" value="파운데이션과정" />파운데이션과정</label>
            <label><input type="checkbox" name="관심분야" value="학사" />학사</label>
            <label><input type="checkbox" name="관심분야" value="프리마스터과정" />프리마스터과정</label>
            <label><input type="checkbox" name="관심분야" value="석사" />석사</label>
            <label><input type="checkbox" name="관심분야" value="박사" />박사</label>
            <label><input type="checkbox" name="관심분야" value="비자대행" />비자대행</label>
            <label><input type="checkbox" name="관심분야" value="기타" />기타</label>
          </div></div>
        <div class="row" role="group" aria-labelledby="l-how"><span class="lbl req" id="l-how">알게 된 경로</span>
          <div class="opts" data-group="알게 된 경로">
            <label><input type="checkbox" name="알게 된 경로" value="영국문화원" />영국문화원</label>
            <label><input type="checkbox" name="알게 된 경로" value="주변소개" />주변소개</label>
            <label><input type="checkbox" name="알게 된 경로" value="SNS" />SNS</label>
            <label><input type="checkbox" name="알게 된 경로" value="네이버" />네이버</label>
            <label><input type="checkbox" name="알게 된 경로" value="다음" />다음</label>
            <label><input type="checkbox" name="알게 된 경로" value="구글" />구글</label>
            <label><input type="checkbox" name="알게 된 경로" value="기타" />기타</label>
          </div></div>
        <div class="row" role="radiogroup" aria-labelledby="l-method"><span class="lbl req" id="l-method">상담 방식</span>
          <div class="opts" data-group="상담 방식">
            <label><input type="radio" name="상담 방식" value="방문상담" />방문상담</label>
            <label><input type="radio" name="상담 방식" value="전화상담" />전화상담</label>
            <label><input type="radio" name="상담 방식" value="이메일상담" />이메일상담</label>
          </div></div>
        <div class="row"><label class="lbl" for="when">희망 상담일시</label><input id="when" name="희망 상담일시" type="text" placeholder="예: 11월 15일(토) 오후 2시, 평일 저녁 6시 이후" /></div>
      </section>

      <!-- 관심분야에 따라 보이는 추가 질문 (선택 입력) -->
      <section class="sec hide" id="sec-lang" data-show="어학연수">
        <h2>어학연수 상담 사전질문</h2>
        <div class="row"><label class="lbl" for="dep">출국 예정일</label><input id="dep" name="출국 예정일" type="text" placeholder="예: 2027년 3월" /></div>
        <div class="row"><label class="lbl" for="region">희망지역</label><input id="region" name="희망지역" type="text" placeholder="예: 런던, 옥스퍼드, 미정" /></div>
        <div class="row"><label class="lbl" for="dur">어학연수 기간</label><input id="dur" name="어학연수 기간" type="text" placeholder="예: 6개월" /></div>
        <div class="row"><label class="lbl" for="budget">전체예산</label><input id="budget" name="전체예산" type="text" /></div>
        <div class="row"><label class="lbl" for="quote">어학연수 비용견적</label><textarea id="quote" name="어학연수 비용견적" rows="3" placeholder="어학연수를 계획하시고 이메일로 어학연수 비용 견적을 받고 싶으신 분께서는 정확한 학교명, 출국일과 총 수업시간, 주당 수업시간, 숙소 신청여부와 기간 등을 상세히 적어주세요"></textarea></div>
      </section>

      <section class="sec hide" id="sec-degree" data-show="조기유학,전문교육과정,학사,석사,박사">
        <h2>정규유학 상담 사전질문</h2>
        <div class="row"><label class="lbl" for="major">희망전공</label><input id="major" name="희망전공" type="text" /></div>
        <div class="row"><label class="lbl" for="year">입학년도</label><input id="year" name="입학년도" type="text" placeholder="예: 2027년 9월" /></div>
        <div class="row"><label class="lbl" for="school">최종 졸업학교와 전공</label><input id="school" name="최종 졸업학교와 전공" type="text" /></div>
        <div class="row"><label class="lbl" for="score">어학 점수</label><input id="score" name="어학 점수" type="text" placeholder="예: IELTS 6.5 (각 영역 6.0)" /></div>
      </section>

      <section class="sec">
        <h2>기타 문의사항</h2>
        <div style="padding-top:14px"><textarea name="기타 문의사항" aria-label="기타 문의사항" placeholder="기타 상담 받고 싶은 내용을 자세히 적어주세요"></textarea></div>
      </section>

      <div class="agree">
        <label><input id="agree" name="개인정보동의" type="checkbox" value="동의함" required />개인정보동의서에 동의합니다.</label>
        <a href="privacy.html" target="_blank" rel="noopener">자세히 보기</a>
      </div>

      <div class="btns">
        <button id="submitBtn" type="submit" class="btn btn-primary">✔ 작성완료</button>
        <button type="reset" class="btn btn-dark">취소</button>
      </div>
    </form>
  </main>

  <div class="foot">
    <div class="box">
      <div><strong>영국유학센터 신촌지사</strong> · 서울특별시 서대문구 신촌로 127 신촌르메이르타운 3차 307호 (창천동)</div>
      <div><strong>전화</strong> 02-393-1030 &nbsp;|&nbsp; <strong>이메일</strong> j.lee@ukcentre.co.kr &nbsp;|&nbsp; <a href="https://uksinchon.com/">uksinchon.com</a></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('counsel-form');
    const btn = document.getElementById('submitBtn');
    const ok = document.getElementById('msg-success');
    const err = document.getElementById('msg-error');
    const GROUPS = ['성별', '관심분야', '알게 된 경로', '상담 방식'];

    function check() {
      let first = null;
      const mark = (el, bad) => { el.classList.toggle('bad', bad); if (bad && !first) first = el; };
      for (const id of ['email', 'name', 'phone']) {
        const el = document.getElementById(id);
        mark(el.closest('.row').querySelector('.lbl'), !el.checkValidity());
      }
      for (const g of GROUPS) {
        const box = form.querySelector(`[data-group="${g}"]`);
        mark(box.closest('.row').querySelector('.lbl'), !box.querySelector('input:checked'));
      }
      const agree = document.getElementById('agree');
      mark(agree.parentElement, !agree.checked);
      if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return !first;
    }

    // 관심분야에 따라 추가 질문 보이기. 숨긴 칸은 전송하지 않습니다.
    function toggleExtra() {
      const picked = [...form.querySelectorAll('input[name="관심분야"]:checked')].map(i => i.value);
      for (const sec of form.querySelectorAll('[data-show]')) {
        const on = sec.dataset.show.split(',').some(v => picked.includes(v));
        sec.classList.toggle('hide', !on);
        sec.querySelectorAll('input,textarea').forEach(el => { el.disabled = !on; });
      }
    }
    form.querySelectorAll('input[name="관심분야"]').forEach(i => i.addEventListener('change', toggleExtra));
    toggleExtra();

    form.addEventListener('reset', () => {
      ok.classList.add('hide'); err.classList.add('hide');
      form.querySelectorAll('.bad').forEach(el => el.classList.remove('bad'));
      setTimeout(toggleExtra);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      ok.classList.add('hide'); err.classList.add('hide');
      if (!check()) {
        err.textContent = '* 표시된 필수 항목을 확인해 주세요.';
        err.classList.remove('hide'); return;
      }
      btn.disabled = true;
      // 여러 개 고른 항목은 쉼표로 묶어 한 칸으로 보냅니다.
      const data = {};
      for (const [k, v] of new FormData(form).entries()) data[k] = (k in data) ? data[k] + ', ' + v : v;
      const mailBody = new FormData();
      for (const [k, v] of Object.entries(data)) mailBody.append(k, v);
      try {
        // 메일(Formspree)과 상담신청 게시판(관리 화면) 두 곳에 함께 보냅니다. 한 곳만 성공해도 접수로 봅니다.
        const [mail, board] = await Promise.allSettled([
          fetch(form.action, { method: 'POST', headers: { 'Accept': 'application/json' }, body: mailBody }),
          fetch('/api/cms/counsel/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
        ]);
        const sent = r => r.status === 'fulfilled' && r.value.ok;
        if (sent(mail) || sent(board)) {
          form.reset(); ok.classList.remove('hide');
          ok.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          err.textContent = '전송에 실패했습니다. 잠시 후 다시 시도해 주세요. 급하시면 02-393-1030으로 전화 주세요.';
          err.classList.remove('hide');
        }
      } finally { btn.disabled = false; }
    });
  </script>
</body>
</html>
